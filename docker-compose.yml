services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/cinema_booking
      - JWT_SECRET=ganti_dengan_rahasia_yang_kuat
      - CORS_ORIGIN=http://localhost:8082
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build: ./frontend/fe-cinemabooking
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  mongo_data:
